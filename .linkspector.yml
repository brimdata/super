dirs:
  - .
useGitIgnore: true
excludedDirs:
  - node_modules
userAgent: 'linkspector (+https://github.com/brimdata/super; docs link check)'

ignorePatterns:

# Currently not crawling links matching the following pattern due to HTTP 429 errors
# See https://github.com/brimdata/super/pull/5887
  - pattern: '^https://github.com/brimdata/super/blob/main/scripts/super-cmd-perf.*$'

# Not crawling the following links because of HTTP 403 (Forbidden) errors.
# Presumably these research-oriented sites don't like being crawled.
  - pattern: '^https://dl.acm.org/doi/pdf/10.1145/984549.984551$'
  - pattern: '^https://www.researchgate.net/publication/221325979_Union_Types_for_Semistructured_Data$'
  - pattern: '^https://db.cs.cmu.edu/papers/2024/whatgoesaround-sigmodrec2024.pdf$'
  - pattern: '^https://openproceedings.org/2017/conf/edbt/paper-62.pdf$'

# Not crawling the following due to persistent HTTP 503 errors
  - pattern: '^https://sqlite.org'

# Not crawling the following due to a Cloudflare challenge that causes HTTP
# 429/403 errors during link checking
# See https://github.com/zeek/zeek/issues/5819
  - pattern: '^https://docs\.zeek\.org'
