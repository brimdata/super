# Test that type contexts are properly reset and reusable after stream boundaries

script: |
  super in.tsup > s.bsup
  super in.tsup >> s.bsup
  super -s s.bsup

inputs:
  - name: in.tsup
    data: |
      {a:"hello"}
      {b:10}

outputs:
  - name: stdout
    data: |
      {a:"hello"}
      {b:10}
      {a:"hello"}
      {b:10}
