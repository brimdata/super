# Test that union true values get de-unioned in filter pushdowns.
script: |
  super -f bsup in.tsup > test.bsup 
  super -s -c 'from test.bsup | where this'

inputs:
  - name: in.tsup
    data: |
      true::(bool|null)
      false::(bool|null)

outputs:
  - name: stdout
    data: |
      true::(bool|null)
