script: |
  source service.sh
  super db create -q test
  super db load -q -use test a.tsup
  super db load -q -use test b.tsup
  super db -s -c "from test@main:objects | sort min | {min:defuse(min),max:defuse(max)}"

inputs:
  - name: service.sh
    source: service.sh
  - name: a.tsup
    data: |
      {ts:1}
  - name: b.tsup
    data: |
      {ts:2}

outputs:
  - name: stdout
    data: |
      {min:1,max:1}
      {min:2,max:2}
