script: super -s -I query.spq

inputs:
  - name: query.spq
    data: |
      values 'a.tsup', 'b.tsup'
      | values (from f"{this}" | collect(this))
  - name: a.tsup
    data: |
      {a:1}
      {a:2}
  - name: b.tsup
    data: |
      {b:3}

outputs:
  - name: stdout
    data: |
      [{a:1},{a:2}]
      [{b:3}]
