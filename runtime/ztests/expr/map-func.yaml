spq: values map(this,&upper)

input: |
  ["foo","bar",null]
  set["foo","bar",null]
  "invalid"
  ["foo","bar"]::([string]|int64)
  fusion(["foo","bar",null]::(string|[string|null]),<[string|null]>)
  null

output: |
  ["FOO","BAR",null]
  set[null,"BAR","FOO"]
  error({message:"map: expected array or set value",on:"invalid"})
  ["FOO","BAR"]
  ["FOO","BAR",null]
  null
  
