spq: values not this

input: |
  true
  false
  null
  true::(bool|null)
  null::(bool|null)
  error("missing")
  error("foo")

output: |
  false
  true
  null
  false
  null
  error({message:"'not' operator: error value encountered",on:error("missing")})
  error({message:"'not' operator: error value encountered",on:error("foo")})

---

# Ensure true/null values are converted to false/null.
spq: |
  values false or not this

input: |
  true
  false
  null

output: |
  false
  true
  null
