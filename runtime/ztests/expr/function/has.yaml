spq: values has({},none), has({},null), has(null, none), has(none, none)

output: |
  error({message:"has: applied to record with non-string key",on:none})
  error({message:"has: applied to record with non-string key",on:null})
  error({message:"has: invalid type",on:null})
  error({message:"has: invalid type",on:none})

---

spq: values has({x?:1},'x'), has({x?:none::int64}, 'x')

output: |
  true
  false

---

spq: values has(this,'a') and has(this,'b')

input: |
  {a:1}
  {b:1}
  {a:1,b:2}
  {a:1,b:null}
  {a:null,b:2}
  {a:null::(null|int64),b:null::(null|int64)}
  {a:error("other"),b:2}
  {a:1,b?:none::int64}

output: |
  false
  false
  true
  true
  true
  true
  true
  false

---

spq: values has(this,'a') and has(this,'b')

input: |
  <{a:int64}>
  <{b:int64}>
  <{a:int64,b:int64}>
  <{a:int64,b:null}>
  <{a:null,b:int64}>
  <{a:null|int64,b:null|int64}>
  <{a:error(string),b:int64}>
  <{a:int64,b?:int64}>

output: |
  false
  false
  true
  true
  true
  true
  true
  true

---

spq: |
  cut r:=this.has('r'),
    rb:=r.has('b'),
    both:=this.has('r') and r.has('b'),
    s:=this.has('s')

input: |
  {r:{a:1::int32},s:123::int32,array:[1,2,3]}
  {r:{a:1::int8,b:2::int8}}

output: |
  {r:true,rb:false,both:false,s:true}
  {r:true,rb:true,both:true,s:false}
