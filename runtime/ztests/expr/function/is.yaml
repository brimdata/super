spq: cut isRecType:=is(r, <{a:int32}>), isString:=is(s, <string>)

input: |
  {r:{a:1::int32},s:123::int32}
  {r:{a:1::int8},s:"a"}

output: |
  {isRecType:true,isString:false}
  {isRecType:false,isString:true}

---

spq: values is(a,b)

input: |
  {a:1::(int64|string),b:<int64>}
  {a:fusion(1::(int64|string),<int64>),b:fusion(<int64>::(type|string),<type>)}
  {a:fusion(1::(int64|string),<int64>),b:fusion("foo"::(type|string),<string>)}

output: |
  false
  true
  error({message:"is: type value argument expected",on:"foo"})
