script: |
  ! super -s -c "cut rec,other,rec" in.tsup
  ! super -s -c "cut rec.sub1,rec.sub1" in.tsup
  ! super -s -c "cut rec.sub,rec.sub.sub" in.tsup
  ! super -s -c "cut rec.sub.sub,rec.sub" in.tsup

inputs:
  - name: in.tsup
    data: |
      {rec:{sub1:0,sub2:0},other:0,rec1:{rec2:{sub1:0,sub2:0},sub2:0}}
      {t:{rec:{sub1:0,sub2:0},other:0}}
      {rec:{sub:{sub:0}}}

outputs:
  - name: stderr
    data: |
      duplicate field: "rec" at line 1, column 5:
      cut rec,other,rec
          ~~~~~~~~~~~~~
      duplicate field: "rec.sub1" at line 1, column 5:
      cut rec.sub1,rec.sub1
          ~~~~~~~~~~~~~~~~~
      duplicate field: "rec.sub.sub" at line 1, column 5:
      cut rec.sub,rec.sub.sub
          ~~~~~~~~~~~~~~~~~~~
      duplicate field: "rec.sub" at line 1, column 5:
      cut rec.sub.sub,rec.sub
          ~~~~~~~~~~~~~~~~~~~
