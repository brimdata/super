spq: values foo, foo.bar

input: |
  <{foo:{bar:int64}}>
  <int64>
  <{foo:ip}>
  null

output: |
  <{bar:int64}>
  <int64>
  error({message:"no such field foo",on:<int64>})
  error({message:"'.': applied to non-record",on:error({message:"no such field foo",on:<int64>})})
  <ip>
  error({message:"no such field bar",on:<ip>})
  error({message:"'.': applied to non-record",on:null})
  error({message:"'.': applied to non-record",on:error({message:"'.': applied to non-record",on:null})})
