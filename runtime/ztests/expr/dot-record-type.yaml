spq: values foo, foo.bar

input: |
  <{foo:{bar:int64}}>
  <int64>
  <{foo:ip}>
  null

output: |
  <{bar:int64}>
  <int64>
  error("missing")
  error({message:"dot operator on non-record",on:error("missing")})
  <ip>
  error("missing")
  error({message:"dot operator on non-record",on:null})
  error({message:"dot operator on non-record",on:error({message:"dot operator on non-record",on:null})})
