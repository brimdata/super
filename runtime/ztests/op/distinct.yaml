script: |
  super -s -c 'from "1.tsup" | distinct x'
  echo ===
  super -s -c 'from "2.tsup" | distinct abs(this)'
  echo ===
  super -s -c 'from "3.tsup" | unnest this into (distinct this | count())'

inputs:
  - name: 1.tsup
    data: |
      {x:1}
      {x:2}
      {x:2}
      {y:3}
      type named={y:int64}
      {y:3}::named
  - name: 2.tsup
    data: |
      1
      -2
      2
      3
  - name: 3.tsup
    data: |
      [1,2,2,3]
      [2,2,3]

outputs:
  - name: stdout
    data: |
      {x:1}
      {x:2}
      {y:3}
      ===
      1
      -2
      3
      ===
      3
      2
