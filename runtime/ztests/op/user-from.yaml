script: |
 super - | super -s -I test.spq

inputs:
  - name: test.spq
    data: |
      const FILE = "A.tsup"
      op test path: (
        from f"{path}" | sort a 
      )
      test FILE
  - name: A.tsup
    data: |
      {a:5}
      {a:1}
      {a:7}
      {a:3}
      {a:8}
  
outputs:
  - name: stdout
    data: |
      {a:1}
      {a:3}
      {a:5}
      {a:7}
      {a:8}
