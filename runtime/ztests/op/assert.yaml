spq: assert a==1

input: |
  {a:1}
  {a:1::(int64|null)}
  {a:2}
  1
  {a:2::(int64|null)}

output: |
  {a:1}
  {a:1::(int64|null)}
  error({message:"assertion failed",expr:"a==1",on:{a:2}})
  error({message:"==: error value encountered",on:error({message:"dot operator on non-record",on:1})})
  error({message:"assertion failed",expr:"a==1",on:{a:2::(int64|null)}})
