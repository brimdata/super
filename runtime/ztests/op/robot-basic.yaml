script: |
  super -s -c 'from files.tsup | from f"{f}"'

inputs:
  - name: files.tsup
    data: |
      {f:"a.tsup"}
      {f:"b.tsup"}
  - name: a.tsup
    data: |
      {s:"hello"}
  - name: b.tsup
    data: |
      {s:"world"}

outputs:
  - name: stdout
    data: |
      {s:"hello"}
      {s:"world"}

---

script: |
  super -s -c 'values "a", "b" | ( from f"{this}.tsup" | head 1 )'

inputs:
  - name: a.tsup
    data: |
      {a:1}
      {a:2}
  - name: b.tsup
    data: |
      {b:1}
      {b:2}

outputs:
  - name: stdout
    data: |
      {a:1}
      {b:1}
