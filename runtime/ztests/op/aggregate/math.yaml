script: |
  super -s -c "avg(n)" in.tsup > avg.tsup
  super -s -c "count()" in.tsup > count.tsup
  super -s -c "dcount(n)" in.tsup in.tsup > dcount.tsup
  # "with -limit 1" exercises the partials paths.
  super -s -c "dcount(n) with -limit 1" in.tsup in.tsup > dcount-partials.tsup
  super -s -c "any(n)" in.tsup > any.tsup
  super -s -c "min(n)" in.tsup > min.tsup
  super -s -c "max(n)" in.tsup > max.tsup

inputs:
  - name: in.tsup
    data: |
      {n:0::int32}
      {n:5::int32}
      {n:10::int32}

outputs:
  - name: avg.tsup
    data: |
      5.
  - name: count.tsup
    data: |
      3
  - name: dcount.tsup
    data: |
      3
  - name: dcount-partials.tsup
    data: |
      3
  # Note: min/max shouldn't be int64 (especially for uint)  Issue #1506.
  - name: any.tsup
    data: |
      0::int32
  - name: min.tsup
    data: |
      0
  - name: max.tsup
    data: |
      10
