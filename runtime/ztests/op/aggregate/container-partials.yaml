# This test exercises the partials paths in the reducers by doing an aggregate
# with a single-row limit.  We also make sure the partials consumer can handle
# an empty input by including a record for key "a" with error("quiet") in the
# value field.
script: |
  super -s -c "union(x) by key with -limit 1 | sort key" in.tsup > union.tsup
  super -s -c "collect(x) by key with -limit 1 | sort key" in.tsup > collect.tsup

inputs:
  - name: in.tsup
    data: |
      {key:"a",x:1::int32}
      {key:"a",x:-1::int32}
      {key:"b",x:2::int32}
      {key:"b",x:1::int32}
      {key:"a",x:8::int32}
      {key:"b",x:1::int32}
      {key:"a",x:error("quiet")}
      {key:"a",x:error("quiet")}
      {key:"a",x:error("quiet")}

outputs:
  - name: union.tsup
    data: |
      {key:"a",union:set[1::int32,-1::int32,8::int32]}
      {key:"b",union:set[1::int32,2::int32]}
  - name: collect.tsup
    data: |
      {key:"a",collect:[1::int32,-1::int32,8::int32]}
      {key:"b",collect:[2::int32,1::int32,1::int32]}
