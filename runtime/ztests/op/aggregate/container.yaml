script: |
  super -s -c "union(x)" in.tsup > union.tsup
  super -s -c "collect(x)" in.tsup > collect.tsup

inputs:
  - name: in.tsup
    data: |
      {x:1::int32}
      {x:-1::int32}
      {x:2::int32}
      {x:1::int32}
      {x:8::int32}
      {x:1::int32}

outputs:
  - name: union.tsup
    data: |
      set[1::int32,-1::int32,2::int32,8::int32]
  - name: collect.tsup
    data: |
      [1::int32,-1::int32,2::int32,1::int32,8::int32,1::int32]
