# Tests that collect correctly handles partial array values that are wrapped
# in a view.
script: |
  super -s -c 'from "test.tsup" | collect(a) by b | sort b'

inputs:
  - name: test.tsup
    data: |
      {a:1,b:"one"}
      {a:2,b:"two"}

outputs:
  - name: stdout
    data: |
      {b:"one",collect:[1]}
      {b:"two",collect:[2]}
