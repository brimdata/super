script: |
  super -s -c 'from a.tsup | inner join (from b.tsup) on left.a=right.b | values left | sort'

inputs:
  - name: a.tsup
    data: |
      {a:1}
      {a:2}
      {a:3}
  - name: b.tsup
    data: |
      {b:1}
      {b:3}
      {b:4}

outputs:
  - name: stdout
    data: |
      {a:1}
      {a:3}
