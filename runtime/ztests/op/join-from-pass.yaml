script: super -s -I join.spq left.tsup

inputs:
  - name: join.spq
    data: |
      fork
        ( pass )
        ( from right.tsup )
      | inner join on left.x=right.y 
      | values {...left,matched:true}
  - name: left.tsup
    data: |
      {x:1,s:"one"}
      {x:2,s:"two"}
      {x:3,s:"three"}
  - name: right.tsup
    data: |
      {y:2,y:"y-two"}

outputs:
  - name: stdout
    data: |
      {x:2,s:"two",matched:true}
