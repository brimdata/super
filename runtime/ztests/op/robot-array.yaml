script: |
  super -s -c 'from which.tsup | values "a"||val::string||".tsup","a"||(val+1)::string||".tsup" | select s from f"{this}"'

inputs:
  - name: which.tsup
    data: |
      {val:1}
      {val:2}
  - name: a1.tsup
    data: |
      {s:"hello"}
  - name: a2.tsup
    data: |
      {s:"world"}
  - name: a3.tsup
    data: |
      {s:"goodbye"}

outputs:
  - name: stdout
    data: |
      {s:"hello"}
      {s:"world"}
      {s:"world"}
      {s:"goodbye"}
