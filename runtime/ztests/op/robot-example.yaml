skip: true

script: |
  super -s -c 'from files.tsup | from [f]'
  echo ===
  super -s -c 'from files.tsup | select value this from [f]'

inputs:
  - name: files.tsup
    data: |
      {f:"a.tsup"}
      {f:"b.tsup"}
  - name: a.tsup
    data: |
      "hello"
  - name: b.tsup
    data: |
      "world"
  - name: query.spq
    data: |
      FROM gharchive.tsup
      | SELECT union(repo.name) AS repo, actor.login AS user
        GROUP BY user
        ORDER BY len(repo) DESC
        LIMIT 5
      | FORK (
        => FROM [f'{user}.tsup']
          | SELECT VALUE {user:login,created_at:time(created_at)}
        => PASS
        )
      | JOIN USING (user)

outputs:
  - name: stdout
    data: |
      "hello"
      "world"
      ===
      "hello"
      "world"
