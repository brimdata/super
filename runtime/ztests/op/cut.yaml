spq: cut foo

input: |
  {foo:1,bar:"one"}
  {foo:2,bar:"two"}
  {foo:1::(int64|null),bar:"x"}
  {foo:null::(int64|null),bar:"x"}
  {bar:"three"}
  null

output: |
  {foo:1}
  {foo:2}
  {foo:1::(int64|null)}
  {foo:null::(int64|null)}
  {foo:error({message:"no such field foo",on:{bar:"three"}})}
  {foo:error({message:"dot operator on non-record",on:null})}
