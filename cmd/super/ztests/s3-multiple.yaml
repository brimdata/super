  source s3.sh
  aws s3api create-bucket --bucket bucket
  aws s3 cp --quiet log1.sup s3://bucket
  aws s3 cp --quiet log2.sup s3://bucket
  super -s -c "sort ts" s3://bucket/log1.sup s3://bucket/log2.sup

