script: |
  source s3.sh
  aws s3api create-bucket --bucket bucket
  aws s3 cp --quiet babble.sup s3://bucket
  super -s -c "count()" s3://bucket/babble.sup

inputs:
  - name: babble.sup
    source: ../../../testdata/babble.sup
  - name: s3.sh
    source: ../../../testdata/s3.sh

outputs:
  - name: stdout
    data: |
      1000
