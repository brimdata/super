script: |
  super -dynamic -e=false -s good.tsup bad.tsup

inputs:
  - name: good.tsup
    data: |
      {_path:"conn",ts:1970-01-01T00:00:01Z}
  - name: bad.tsup
    data: |
      This is not a detectable format.

outputs:
  - name: stdout
    data: |
      {_path:"conn",ts:1970-01-01T00:00:01Z}
  - name: stderr
    regexp: |
      bad.tsup: format detection error.*
