# Second input has bad middle line (detection succeeds).
script: |
  ! super -dynamic -e=false -s good.tsup bad.tsup

inputs:
  - name: good.tsup
    data: |
      {_path:"conn",ts:1970-01-01T00:00:01Z}
  - name: bad.tsup
    data: |
      {_path:"conn",ts:1970-01-01T00:00:01Z}
      {_path:"conn",ts:1970-01-01T00:00:01Z}
      {_path:"conn",ts:1970-01-01T00:00:01Z}::(1)
      {_path:"conn",ts:1970-01-01T00:00:01Z}

outputs:
  - name: stdout
    data: |
      {_path:"conn",ts:1970-01-01T00:00:01Z}
  - name: stderr
    data: |
      bad.tsup: no such type name: "1"
