script: |
  echo === -P 2
  super compile -C -P 2 -dynamic 'fork ( from a.bsup | sort b ) ( from c.bsup | sort d )'
  echo === -P 5
  super compile -C -P 5 -dynamic 'fork ( from a.bsup | sort b ) ( from c.bsup | sort d )'
  echo === -P 6
  super compile -C -P 6 -dynamic 'fork ( from a.bsup | sort b ) ( from c.bsup | sort d )'

outputs:
  - name: stdout
    data: |
      === -P 2
      fork
        (
          file a.bsup format bsup unordered
          | scatter
            (
              sort b asc nulls last
            )
            (
              sort b asc nulls last
            )
          | merge b asc nulls last
          | output main
        )
        (
          file c.bsup format bsup unordered
          | scatter
            (
              sort d asc nulls last
            )
            (
              sort d asc nulls last
            )
          | merge d asc nulls last
          | output main
        )
      === -P 5
      fork
        (
          file a.bsup format bsup unordered
          | scatter
            (
              sort b asc nulls last
            )
            (
              sort b asc nulls last
            )
          | merge b asc nulls last
          | output main
        )
        (
          file c.bsup format bsup unordered
          | scatter
            (
              sort d asc nulls last
            )
            (
              sort d asc nulls last
            )
          | merge d asc nulls last
          | output main
        )
      === -P 6
      fork
        (
          file a.bsup format bsup unordered
          | scatter
            (
              sort b asc nulls last
            )
            (
              sort b asc nulls last
            )
            (
              sort b asc nulls last
            )
          | merge b asc nulls last
          | output main
        )
        (
          file c.bsup format bsup unordered
          | scatter
            (
              sort d asc nulls last
            )
            (
              sort d asc nulls last
            )
            (
              sort d asc nulls last
            )
          | merge d asc nulls last
          | output main
        )
