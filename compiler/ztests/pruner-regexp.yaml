script: |
  super compile -C -O -dynamic 'from test.bsup | where x LIKE "cslab%"'
  echo // ===
  super compile -C -O -dynamic 'from test.bsup | where grep("^csla[bB].*", x)'
  echo // ===
  super compile -C -O -dynamic 'from test.bsup | where grep("csla[bB].*", x)'
  echo // ===
  echo '{x:"a"}' | super -o x.bsup -
  super -s -c "SELECT x FROM x.bsup WHERE x LIKE 'a%'"
  echo // ===
  echo '{x:"a"}' | super -o x.parquet -
  super -s -c "SELECT x FROM x.parquet WHERE x LIKE 'a%'"

outputs:
  - name: stdout
    data: |
      file test.bsup format bsup filter (regexp_search(r"(?s)^cslab.*?$", x))
         pruner (
           expr compare("cslab", x.max, true)<=0 and compare("cslac", x.min, true)>0
           fields x.max,x.min
        )
      | where regexp_search(r"(?s)^cslab.*?$", x)
      | output main
      // ===
      file test.bsup format bsup filter (regexp_search(r"^csla[bB].*", x))
         pruner (
           expr compare("csla", x.max, true)<=0 and compare("cslb", x.min, true)>0
           fields x.max,x.min
        )
      | where regexp_search(r"^csla[bB].*", x)
      | output main
      // ===
      file test.bsup format bsup filter (regexp_search(r"csla[bB].*", x))
      | where regexp_search(r"csla[bB].*", x)
      | output main
      // ===
      {x:"a"}
      // ===
      {x:"a"}
