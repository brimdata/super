script: super -s -I src.spq

inputs:
  - name: src.spq
    data: |
      const A=1
      fork
        ( from a.tsup | put x:=A+1 )
        ( from b.tsup | put x:=A )
      | sort x

  - name: a.tsup
    data: |
      {a:1}

  - name: b.tsup
    data: |
      {b:2}

outputs:
  - name: stdout
    data: |
      {b:2,x:1}
      {a:1,x:2}
