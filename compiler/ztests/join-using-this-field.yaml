script: |
  super -s -c "from a.tsup | join (from b.tsup) using (this)"

inputs:
  - name: a.tsup
    data: |
      {a:1,this:10}
      {a:2,this:10}
      {a:3,this:11}
  - name: b.tsup
    data: |
      {b:1,this:10}

outputs:
  - name: stdout
    data: |
      {left:{a:1,this:10},right:{b:1,this:10}}
      {left:{a:2,this:10},right:{b:1,this:10}}
