
script: |
  super -s -c 'select val between lower and upper as x from in.tsup'
  echo ===
  super -s -c 'select val not between lower and upper as x from in.tsup'
  echo ===
  super -s -c 'values  "Cat" BETWEEN upper(lower) And upper(upper)' in.tsup
  echo ===
  super -s -c 'values  "Cat" NOT BETWEEN upper(lower) And upper(upper)' in.tsup

inputs:
  - name: in.tsup
    data: |
      {val:1,lower:5,upper:10}
      {val:8,lower:5,upper:10}
      {val:22,lower:5,upper:10}
      {val:"a",lower:"bee",upper:"eel"}
      {val:"cat",lower:"bee",upper:"eel"}

outputs:
  - name: stdout
    data: |
      {x:false}
      {x:true}
      {x:false}
      {x:false}
      {x:true}
      ===
      {x:true}
      {x:false}
      {x:true}
      {x:true}
      {x:false}
      ===
      error({message:"upper: string arg required",on:5})
      error({message:"upper: string arg required",on:5})
      error({message:"upper: string arg required",on:5})
      true
      true
      ===
      error({message:"upper: string arg required",on:5})
      error({message:"upper: string arg required",on:5})
      error({message:"upper: string arg required",on:5})
      false
      false
