script: |
  super -s -c "select this from a.tsup"
  echo ===
  super -s -c "select this as x from a.tsup"
  echo ===
  cat a.tsup | super -s -c "select this as x" -
  echo ===
  super -s -c "select x from (select this as x from a.tsup) where this={x:2}"

inputs:
  - name: a.tsup
    data: |
      1
      2
      3
  - name: b.tsup
    data: |
      2
      3
      4
outputs:
  - name: stdout
    data: |
      {that:1}
      {that:2}
      {that:3}
      ===
      {x:1}
      {x:2}
      {x:3}
      ===
      {x:1}
      {x:2}
      {x:3}
      ===
      {x:2}
