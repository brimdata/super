script: |
  ! super -s -c "select 1|3" >& err1
  super -s -c "select x | values x+1" x.tsup
  echo ===
  super -s -c "select x | x+1" x.tsup
  echo ===
  super -s -c "select x |> x+1" x.tsup

inputs:
  - name: n1.tsup
    data: |
      null
  - name: x.tsup
    data: |
      {x:2}


outputs:
  - name: stdout
    data: |
      3
      ===
      3
      ===
      3
  - name: err1
    data: |
      parse error at line 1, column 11:
      select 1|3
            === ^ ===
