script: |
  super -f parquet -o a.parquet a.tsup
  ! super -c "select count() from a.parquet having a=1"

inputs:
  - name: a.tsup
    data: |
      {a:1}
      {a:2}
      {a:3}

outputs:
  - name: stderr 
    data: |
      column "a" must appear in GROUP BY clause at line 1, column 38:
      select count() from a.parquet having a=1
                                           ~
