script: |
  export SUPER_DB=test
  super db init -q
  super db create -use -q test
  a=$(super db load a.tsup | head -1 | awk '{print $1}')
  b=$(super db load b.tsup | head -1 | awk '{print $1}')
  super db -s -c "from test | sort this"
  super db revert -q $a
  echo ===
  super db -s -c "from test | sort this"
  super db revert -q $b
  echo ===
  super db -s -c "from test | sort this"

inputs:
  - name: a.tsup
    data: |
      {a:1}
  - name: b.tsup
    data: |
      {b:1}

outputs:
  - name: stdout
    data: |
      {a:1}
      {b:1}
      ===
      {b:1}
      ===
