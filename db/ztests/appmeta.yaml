script: |
  export SUPER_DB=test
  super db init -q
  super db create -q logs
  super db load -q -use logs -meta '"original"' babble.tsup
  super db load -q -use logs -meta '"normalized-v1"' babble.tsup
  super db load -q -use logs -meta '"normalized-v2"' babble.tsup
  super db -s -c "from logs@main:log | meta:=defuse(meta) | grep('normalized.*', meta) | sort date | cut meta"

inputs:
  - name: babble.tsup
    source: ../../testdata/babble.tsup

outputs:
  - name: stdout
    data: |
      {meta:"normalized-v1"}
      {meta:"normalized-v2"}
