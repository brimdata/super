script: |
  export SUPER_DB=test
  super db init -q
  super db create -use -q logs
  super db load -q babble-split1.tsup
  super db load -q babble-split2.tsup
  super db -S -c "from logs@main:objects | sort -r size | drop id | min:=defuse(min),max:=defuse(max)"

inputs:
  - name: babble.tsup
    source: ../../testdata/babble.tsup
  - name: babble-split1.tsup
    source: ../../testdata/babble-split1.tsup
  - name: babble-split2.tsup
    source: ../../testdata/babble-split2.tsup

outputs:
  - name: stdout
    data: |
      {
        min: 2020-04-21T22:40:30.06852324Z,
        max: 2020-04-22T01:23:40.0622373Z,
        count: 500::uint64,
        size: 17075
      }
      {
        min: 2020-04-21T22:40:49.0635839Z,
        max: 2020-04-22T01:23:21.06632034Z,
        count: 500::uint64,
        size: 17044
      }
