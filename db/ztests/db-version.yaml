script: |
  export SUPER_DB=test
  super db init -q
  super db create -q test
  mv test/superdb.bsuprows superdb-orig.bsuprows
  super -o test/superdb.bsuprows -c 'version:=1' superdb-orig.bsuprows
  ! super db serve

outputs:
  - name: stderr
    data: |
      unsupported database version: found version 1 while expecting 5
