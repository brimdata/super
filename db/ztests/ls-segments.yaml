script: |
  export SUPER_DB=test
  super db init -q
  super db create -q test
  super db load -q -use test 1.tsup
  super db load -q -use test 2.tsup
  super db -f db -c "from test@main:objects"

inputs:
  - name: 1.tsup
    data: |
      {x:1}
  - name: 2.tsup
    data: |
      {x:2}

outputs:
  - name: stdout
    regexp: |
      \w{27} \d+B bytes 1 records
         min null max null
      \w{27} \d+B bytes 1 records
         min null max null
