# Show that null values of pool key can be retrieved

script: |
  export SUPER_DB=test
  super db init -q
  super db create -q -orderby k tmp
  super db load -q -use tmp in.tsup
  super db -s -c "from tmp | !has(k)"

inputs:
  - name: in.tsup
    data: |
      {k:0,v:"zero"}
      {v:"this one missing"}
      {k:1,v:"one"}

outputs:
  - name: stdout
    data: |
      {v:"this one missing"}
