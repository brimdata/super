script: |
  source s3.sh
  aws s3api create-bucket --bucket bucket
  export SUPER_DB=s3://bucket/db
  super db init -q
  super db create -q logs
  super db load -q -use logs babble.sup
  super db -s -c "from logs | count()"

inputs:
  - name: babble.sup
    source: ../../../testdata/babble.sup
  - name: s3.sh
    source: ../../../testdata/s3.sh

outputs:
  - name: stdout
    data: |
      1000
